# Generated by iterative/runconfig.py for round r2.
# Same include chain, transforms and optimizer groups as configs/LSP-T-tils3.yml; what differs:
#   data     -> this round's reviewed patches (held-out case: SSMH_BRS_HE_309)
#   tuning   -> the trained 3-class detector best_stg1.pth, passed as -t by the launcher
#               (NOT ckpt/checkpoint0022_3class.pth, which is only a head-expanded init)
#   schedule -> 12 epochs, MultiStepLR [8, 10] gamma 0.5 (the 80-epoch recipe
#               existed to converge a freshly expanded head; this head is already trained)
# best_stg1.pth is chosen by the val evaluator's AP on the held-out case's fixed tiles.
__include__: [
  './dataset/iter_r2_detection.yml',
  '../../../AIVIS-DETECTION/AIVIS-Dome-DETR/configs/runtime.yml',
  '../../../AIVIS-DETECTION/AIVIS-Dome-DETR/configs/dome/include/dataloader.yml',
  '../../../AIVIS-DETECTION/AIVIS-Dome-DETR/configs/dome/include/optimizer.yml',
  './include/lsp_swinv2.yml',
]

output_dir: /mnt/14T-1/tksong/SSMH-BRS-456-iter/r2/train/lsp

checkpoint_freq: 2

num_visualization_batches_per_gpu: 1
num_visualization_samples_per_batch: null
visualization_epoch_interval: 20
visualization_save_rank0_only: false
num_visualization_sample_batch: 1

eval_spatial_size: [1536, 1536] # h w

LSPDetrDetection:
  pretrained: null

train_dataloader:
  dataset:
    dataset:
      transforms:
        type: Compose
        ops:
          - {type: RandomCropWithGridNoDummy, crop_size: 1536, center_gt_size: 672}
          - {type: ColorJitter, brightness: 0.1, contrast: 0.1, saturation: 0.1, hue: 0.05}
          - {type: RandomHorizontalFlip, p: 0.5}
          - {type: RandomVerticalFlip, p: 0.5}
          - {type: SanitizeBoundingBoxes, min_size: 2}
          - {type: ConvertPILImage, dtype: 'float32', scale: True}
          - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
          - {type: RandomGaussianBlur, p: 0.25, kernel_size: [3, 5], sigma: [0.1, 1.0]}
          - {type: ImageNetNormalize}

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [1536, 1536], }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ImageNetNormalize}

DomePostProcessor:
  num_top_queries: 2000
  use_nms: true
  nms_iou_threshold: 0.7
  nms_score_threshold: 0.01
  class_agnostic: true
  keep_topk_after_nms: null

optimizer:
  type: AdamW
  params:
    - params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 2.5e-6
    - params: '^(?=.*backbone)(?=.*norm).*$'
      lr: 2.5e-6
      weight_decay: 0.0
    - params: '^(?!.*backbone)(?=.*norm).*$'
      weight_decay: 0.0
  lr: 0.00005
  betas: [0.9, 0.999]
  weight_decay: 0.000125

lr_scheduler:
  type: MultiStepLR
  milestones: [8, 10]
  gamma: 0.5

lr_warmup_scheduler:
  warmup_duration: 25
