# Generated by iterative/runconfig.py for round r1. Do not hand-edit; re-run export.
# Class contract 0=non_tumor / 1=tumor / 2=Lymphocyte -- identical to tils3_detection.yml.
# Train: the full 4096 reviewed patches; GridSubsetCropWrapper draws 1536 crops only from
# the whitelisted centre cells in allowed_grids.json (every cell except those holding an
# unconfirmed nucleus -- validation is a different case, so no cell is held out here).
# Val:   fixed 1536 tiles from the held-out case (SSMH_BRS_HE_309), GT = the centre-672 window.
task: detection

evaluator:
  type: AitodCocoEvaluator
  iou_types: ['bbox', ]

num_classes: 3
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: GridSubsetCropWrapper
    crops_per_image: 72
    allowed_grids: /mnt/14T-1/tksong/SSMH-BRS-456-iter/r1/data/lsp/allowed_grids.json
    strategy: cycle
    dataset:
      type: CocoDetection
      img_folder: /mnt/14T-1/tksong/SSMH-BRS-456-iter/r1/data/lsp/images
      ann_file: /mnt/14T-1/tksong/SSMH-BRS-456-iter/r1/data/lsp/train_coco.json
      return_masks: False
      transforms:
        type: Compose
        ops: ~

  shuffle: True
  num_workers: 4
  drop_last: True
  persistent_workers: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /mnt/14T-1/tksong/SSMH-BRS-456-iter/r1/data/lsp/val_tiles
    ann_file: /mnt/14T-1/tksong/SSMH-BRS-456-iter/r1/data/lsp/val_coco.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 2
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
